name: Update README Cache Bust

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update cache_bust in README
        run: |
          TIMESTAMP=$(date +%s)
          sed -i -E "s/(cache_bust=)[0-9]+/\1$TIMESTAMP/g" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "chore: update cache_bust to refresh streak stats" || echo "No changes to commit"
          git push